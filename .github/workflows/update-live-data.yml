name: Update live market data

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays after the US close (21:30 UTC)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/fetch_live.py
      - name: Commit if changed
        run: |
          git config user.name "wsm-bot"
          git config user.email "wsm-bot@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "Live data: $(date -u +%Y-%m-%d)"
          git push
